name: Run Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if nc -z mongodb 27017; then
              echo "MongoDB is ready!"
              exit 0
            fi
            echo "Waiting for MongoDB... (attempt $i/30)"
            sleep 2
          done
          echo "MongoDB failed to start"
          exit 1

      - name: Run tests
        env:
          MONGODB_URI: mongodb://mongodb:27017/bdTemp
          PORT: 3000
        run: npm test